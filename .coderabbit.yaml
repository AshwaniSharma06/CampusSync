# CodeRabbit Configuration for CampusSync-Frontend
# Docs: https://docs.coderabbit.ai/getting-started/configure-coderabbit

version: "2"
language: "en-US"

tone_instructions: "Provide encouraging, constructive, and highly technical feedback. Focus on React 18 best practices, performance, accessibility, and fidelity to DESIGN.md."

reviews: "profile: assertive"
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!node_modules/**"
    - "!dist/**"
    - "!package-lock.json"

chat:
  auto_reply: true

instructions:
  path: "**/*.{js,jsx,ts,tsx}"
  instructions: |
    - **Architecture & Tech Stack**: This project is built using React 18, Vite, Tailwind CSS v3, and Three.js.
    - **Design System Alignment**: Follow guidelines in `DESIGN.md` (Cinematic Academic palette, Midnight Navy `#04132a`, Intelligent Teal `#71d8c8`, Soft Gold `#e6c277`).
    - **Typography**: Use Instrument Serif for editorial headers and Manrope for UI/body text.
    - **Performance**: Ensure Three.js canvas components recycle WebGL contexts properly and unmount event listeners.
    - **Accessibility**: Ensure interactive elements are keyboard reachable and have proper `aria-*` attributes.
